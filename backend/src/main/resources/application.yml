spring:
  application:
    name: event-mpos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventmpos}
    username: ${DB_USERNAME:eventmpos}
    password: ${DB_PASSWORD:eventmpos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

# Auth configuration. SECRET must be overridden in production via env var.
app:
  jwt:
    # Base64-encoded 256-bit secret. Default is for local dev ONLY.
    secret: ${JWT_SECRET:ZHYtbG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
  seed:
    # Seed an initial admin + sample data on startup when true (dev convenience).
    enabled: ${SEED_ENABLED:true}
  erp:
    # Which ERP adapter to use: mock (dev default) | file | rest
    source: ${ERP_SOURCE:mock}
    # For source=file: a Spring resource path to the CSV export
    file-path: ${ERP_FILE_PATH:classpath:erp/products.csv}
    # For source=rest: the ERP product endpoint
    rest-url: ${ERP_REST_URL:}
    # Background pull on a schedule. Off by default; admins can also sync on demand from the dashboard.
    scheduled-sync-enabled: ${ERP_SCHEDULED:false}
    sync-cron: ${ERP_SYNC_CRON:0 0 * * * *}

logging:
  level:
    org.springframework.security: INFO
