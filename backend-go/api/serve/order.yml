openapi: 3.0.3
info:
  title: POS order API
  version: "1.0.0"
tags:
  - name: order
paths:
  /api/warehouse/events/{eventId}/orders:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [order]
      operationId: listWarehouseOrders
      summary: "Order board, optionally by status"
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '../components/schemas.yml#/components/schemas/WarehouseOrderView' } } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/warehouse/orders/{orderId}/status:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [order]
      operationId: advanceOrderStatus
      summary: "Advance NEW → PACKING → READY → COLLECTED"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/AdvanceStatusRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/WarehouseOrderView' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '409': { description: Conflict with the current state, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/warehouse/orders/{orderId}/cancel:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      tags: [order]
      operationId: cancelOrderWarehouse
      summary: "Cancel an order (NEW or PACKING)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/CancelOrderRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/WarehouseOrderView' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '409': { description: Conflict with the current state, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/me/orders/{orderId}/cancel:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      tags: [order]
      operationId: cancelOrderBa
      summary: "BA cancels their own order (NEW or PACKING)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/CancelOrderRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/WarehouseOrderView' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '409': { description: Conflict with the current state, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /ws/events/{eventId}/orders:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [order]
      operationId: orderBoardSocket
      summary: "WebSocket: pushes WarehouseOrderView after each order change; JWT in ?token"
      x-websocket: true
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '101': { description: Switching protocols }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
