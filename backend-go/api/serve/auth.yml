openapi: 3.0.3
info:
  title: POS auth API
  version: "1.0.0"
tags:
  - name: auth
paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Log in with email and password"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/TokenResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: "Rotate the refresh token"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/RefreshRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/TokenResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Revoke all refresh tokens of the caller"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
