openapi: 3.0.3
info:
  title: POS stock API
  version: "1.0.0"
tags:
  - name: stock
paths:
  /api/admin/events/{id}/stock:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [stock]
      operationId: listAllocations
      summary: "Allocation per product for an event"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '../components/schemas.yml#/components/schemas/AllocationRow' } } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/admin/events/{id}/stock/{productId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: productId, in: path, required: true, schema: { type: string } }
    put:
      tags: [stock]
      operationId: setAllocation
      summary: "Set allocation (DRAFT events only)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/SetAllocationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/AllocationRow' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '409': { description: Conflict with the current state, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/warehouse/events:
    get:
      tags: [stock]
      operationId: listWarehouseEvents
      summary: "Events for the warehouse board"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '../components/schemas.yml#/components/schemas/EventResponse' } } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
  /api/warehouse/events/{eventId}/stock:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string } }
    get:
      tags: [stock]
      operationId: listStockLevels
      summary: "Stock levels with low-stock flags"
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '../components/schemas.yml#/components/schemas/StockLevelRow' } } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
        '403': { description: Not allowed for this role, content: { application/json: { schema: { $ref: '../components/schemas.yml#/components/schemas/ErrorResponse' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
