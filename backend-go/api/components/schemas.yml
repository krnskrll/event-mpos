openapi: 3.0.3
info:
  title: POS shared schemas
  version: "1.0.0"
paths: {}
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
    SnapshotHashResponse:
      type: object
      required: [snapshotHash, checkedAt]
      properties:
        snapshotHash: { type: string }
        checkedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresInSeconds: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserSummary' }
    UserSummary:
      type: object
      required: [id, email, fullName, role, storeId]
      properties:
        storeId: { type: string, format: uuid }
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [ADMIN] }
    EventResponse:
      type: object
      required: [id, code, name, status, storeId, type]
      properties:
        storeId: { type: string, format: uuid }
        type: { type: string, enum: [event, outlet] }
        address: { type: string }
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
        closedAt: { type: string, format: date-time }
    UpdateEventRequest:
      type: object
      properties:
        address: { type: string, nullable: true }
        name: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
    EventSnapshot:
      type: object
      required: [event, version, products, stock, members, promotions, memberCount]
      properties:
        event: { $ref: '#/components/schemas/EventResponse' }
        version: { type: string }
        products: { type: array, items: { $ref: '#/components/schemas/ProductSnapshotDto' } }
        stock: { type: array, items: {} }
        members: { type: array, items: { $ref: '#/components/schemas/MemberSnapshotDto' } }
        promotions: { type: array, items: { $ref: '#/components/schemas/PromotionSnapshotDto' } }
        memberCount: { type: integer }
    SnapshotStatus:
      type: object
      required: [changed, version]
      properties:
        changed: { type: boolean }
        version: { type: string }
    ProductResponse:
      type: object
      required: [id, defaultVariantId, sku, name, price, source, active, warehouseStock, barcodes, variants, updatedAt]
      properties:
        id: { type: string, format: uuid }
        defaultVariantId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        price: { type: integer, format: int64 }
        imageUrl: { type: string }
        source: { type: string, enum: [ERP, MANUAL] }
        active: { type: boolean }
        warehouseStock: { type: integer }
        barcodes: { type: array, items: { $ref: '#/components/schemas/BarcodeDto' } }
        variants: { type: array, items: { $ref: '#/components/schemas/VariantDto' } }
        updatedAt: { type: string, format: date-time }
    BarcodeDto:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string }
        label: { type: string }
    VariantDto:
      type: object
      required: [id, name, sku, price, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        price: { type: integer, format: int64 }
        active: { type: boolean }
    ProductSnapshotDto:
      type: object
      required: [id, sku, name, price, barcodes, variants, remainingStock]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        price: { type: integer, format: int64 }
        imageUrl: { type: string }
        barcodes: { type: array, items: { type: string } }
        variants: { type: array, items: { $ref: '#/components/schemas/VariantSnapshotDto' } }
        remainingStock: { type: integer }
    VariantSnapshotDto:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, format: int64 }
    MemberResponse:
      type: object
      required: [id, memberCode, qrCode, name, tier, active, updatedAt]
      properties:
        id: { type: string, format: uuid }
        memberCode: { type: string }
        qrCode: { type: string }
        name: { type: string }
        tier: { type: string, enum: [STANDARD, SILVER, GOLD, PLATINUM] }
        region: { type: string }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
    MemberSnapshotDto:
      type: object
      required: [qrCode, name, tier]
      properties:
        qrCode: { type: string }
        name: { type: string }
        tier: { type: string, enum: [STANDARD, SILVER, GOLD, PLATINUM] }
    AllocationRow:
      type: object
      required: [productId, sku, name, warehouseStock, allocatedQty, soldQty, remaining]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        warehouseStock: { type: integer }
        allocatedQty: { type: integer }
        soldQty: { type: integer }
        remaining: { type: integer }
    SetAllocationRequest:
      type: object
      properties:
        allocatedQty: { type: integer }
    StockLevelRow:
      type: object
      required: [productId, sku, name, allocatedQty, soldQty, remaining, lowStock]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        allocatedQty: { type: integer }
        soldQty: { type: integer }
        remaining: { type: integer }
        lowStock: { type: boolean }
    BaStockLevel:
      type: object
      required: [productId, remaining, lowStock]
      properties:
        productId: { type: string, format: uuid }
        remaining: { type: integer }
        lowStock: { type: boolean }
    PromotionResponse:
      type: object
      required: [id, locationId, name, type, scope, productIds, active, priority]
      properties:
        id: { type: string, format: uuid }
        locationId: { type: string, format: uuid, nullable: true, description: "null = every location" }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [PERCENTAGE, FIXED, BUNDLE] }
        percentOff: { type: number }
        amountOff: { type: integer, format: int64 }
        scope: { type: string, enum: [ALL, SPECIFIC] }
        productIds: { type: array, items: { type: string, format: uuid } }
        minQty: { type: integer }
        minSubtotal: { type: integer, format: int64 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        active: { type: boolean }
        priority: { type: integer }
    PromotionRequest:
      type: object
      required: [name, type]
      properties:
        locationId: { type: string, format: uuid, nullable: true, description: "back office only; null = every location" }
        categoryId: { type: string, format: uuid, nullable: true, description: "SPECIFIC scope: a category instead of productIds" }
        name: { type: string }
        type: { type: string, enum: [PERCENTAGE, FIXED, BUNDLE] }
        percentOff: { type: number, nullable: true }
        amountOff: { type: integer, format: int64, nullable: true }
        scope: { type: string, enum: [ALL, SPECIFIC], nullable: true }
        productIds: { type: array, items: { type: string, format: uuid } }
        minQty: { type: integer, nullable: true }
        minSubtotal: { type: integer, format: int64, nullable: true }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean, nullable: true }
        priority: { type: integer, nullable: true }
    PromotionSnapshotDto:
      type: object
      required: [id, name, type, scope, productIds, priority]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [PERCENTAGE, FIXED, BUNDLE] }
        percentOff: { type: number }
        amountOff: { type: integer, format: int64 }
        scope: { type: string, enum: [ALL, SPECIFIC] }
        productIds: { type: array, items: { type: string, format: uuid } }
        minQty: { type: integer }
        minSubtotal: { type: integer, format: int64 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        priority: { type: integer }
    QuoteLine:
      type: object
      required: [productId, qty]
      properties:
        productId: { type: string, format: uuid }
        qty: { type: integer }
    QuoteRequest:
      type: object
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/QuoteLine' } }
    QuoteResponse:
      type: object
      required: [subtotal, discount, total]
      properties:
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        appliedPromotionId: { type: string, format: uuid }
        appliedPromotionName: { type: string }
    NumberBlockResponse:
      type: object
      required: [eventId, businessDate, rangeStart, rangeEnd]
      properties:
        eventId: { type: string, format: uuid }
        businessDate: { type: string }
        rangeStart: { type: integer }
        rangeEnd: { type: integer }
    CustomerInfo:
      type: object
      required: [name]
      properties:
        name: { type: string }
        qrCode: { type: string, nullable: true }
        tier: { type: string, nullable: true }
    OrderLineRequest:
      type: object
      properties:
        productId: { type: string, format: uuid }
        qty: { type: integer }
        variantId: { type: string, format: uuid, nullable: true }
    SubmitOrderRequest:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string }
        customer: { $ref: '#/components/schemas/CustomerInfo' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLineRequest' } }
        deviceId: { type: string, nullable: true, description: ignored; the server records the paired device }
        orderNumber: { type: integer, nullable: true }
        clientCreatedAt: { type: string, format: date-time, nullable: true }
    OrderItemView:
      type: object
      required: [productId, sku, name, unitPrice, qty, lineTotal]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unitPrice: { type: integer, format: int64 }
        qty: { type: integer }
        lineTotal: { type: integer, format: int64 }
        variantName: { type: string }
    OrderConfirmation:
      type: object
      required: [id, orderNumber, orderNumberDisplay, referenceId, status, eventCode, eventName, customerName, items, subtotal, discount, total, createdAt, cashierNote, duplicate, stockConflict, lateSynced]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: integer }
        orderNumberDisplay: { type: string }
        referenceId: { type: string }
        status: { type: string, enum: [NEW, PACKING, READY, COLLECTED, CANCELLED] }
        eventCode: { type: string }
        eventName: { type: string }
        customerName: { type: string }
        customerTier: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItemView' } }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        promotionName: { type: string }
        createdAt: { type: string, format: date-time }
        cashierNote: { type: string }
        duplicate: { type: boolean }
        stockConflict: { type: boolean }
        lateSynced: { type: boolean }
    OrderSummary:
      type: object
      required: [id, orderNumberDisplay, referenceId, status, customerName, total, itemCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNumberDisplay: { type: string }
        referenceId: { type: string }
        status: { type: string, enum: [NEW, PACKING, READY, COLLECTED, CANCELLED] }
        customerName: { type: string }
        total: { type: integer, format: int64 }
        itemCount: { type: integer }
        createdAt: { type: string, format: date-time }
    WarehouseItem:
      type: object
      required: [name, sku, qty]
      properties:
        name: { type: string }
        sku: { type: string }
        qty: { type: integer }
    WarehouseOrderView:
      type: object
      required: [id, orderNumber, orderNumberDisplay, referenceId, customerName, baName, items, status, total, createdAt, stockConflict, lateSynced]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: integer }
        orderNumberDisplay: { type: string }
        referenceId: { type: string }
        customerName: { type: string }
        baName: { type: string, description: the cashier (staff) who sold it }
        items: { type: array, items: { $ref: '#/components/schemas/WarehouseItem' } }
        status: { type: string, enum: [NEW, PACKING, READY, COLLECTED, CANCELLED] }
        total: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        stockConflict: { type: boolean }
        lateSynced: { type: boolean }
    CancelOrderRequest:
      type: object
      required: [supervisorId, supervisorPin]
      properties:
        reason: { type: string, nullable: true }
        supervisorId: { type: string, format: uuid }
        supervisorPin: { type: string }
    AdvanceStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [NEW, PACKING, READY, COLLECTED, CANCELLED] }
    AuditEntryResponse:
      type: object
      required: [id, orderId, orderReference, action, actorName, at]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderReference: { type: string }
        action: { type: string, enum: [ORDER_CREATED, STATUS_CHANGED, RECEIPT_PRINTED, ORDER_CANCELLED] }
        actorName: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        detail: { type: string }
        at: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntryResponse' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    SalesRow:
      type: object
      required: [productId, sku, name, unitsSold, revenue]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unitsSold: { type: integer }
        revenue: { type: integer, format: int64 }
    SalesReport:
      type: object
      required: [locationId, from, to, final, totalOrders, cancelledOrders, lateSyncedOrders, totalItems, productCount, promotionsUsed, totalRevenue, totalDiscount, products]
      properties:
        locationId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        final: { type: boolean }
        totalOrders: { type: integer }
        cancelledOrders: { type: integer }
        lateSyncedOrders: { type: integer }
        totalItems: { type: integer }
        productCount: { type: integer }
        promotionsUsed: { type: integer }
        totalRevenue: { type: integer, format: int64 }
        totalDiscount: { type: integer, format: int64 }
        products: { type: array, items: { $ref: '#/components/schemas/SalesRow' } }
    Category:
      type: object
      required: [id, name, itemIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        itemIds: { type: array, items: { type: string, format: uuid } }
    CatalogSyncStatus:
      type: object
      required: [linked, cached]
      properties:
        linked: { type: boolean }
        cached: { type: integer, format: int64 }
        cursorAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    SourceOption:
      type: object
      required: [productId, name, code, variantCount]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        variantCount: { type: integer }
    CatalogueItem:
      type: object
      required: [id, displayName, productName, code, variants, variantsSold, status, locationIds]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        photoUrl: { type: string, nullable: true }
        productName: { type: string }
        code: { type: string }
        categoryName: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        variants: { type: integer }
        variantsSold: { type: integer }
        priceMin: { type: integer, format: int64, nullable: true }
        priceMax: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [active, archived] }
        locationIds: { type: array, items: { type: string, format: uuid } }
    CatalogueItemDetail:
      type: object
      required: [id, displayName, status, source, variants, locations]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        photoUrl: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        basePrice: { type: integer, format: int64, nullable: true }
        source:
          type: object
          required: [productName, code, archived]
          properties:
            productName: { type: string }
            code: { type: string }
            brand: { type: string, nullable: true }
            categoryName: { type: string, nullable: true }
            barcode: { type: string, nullable: true }
            imageUrl: { type: string, nullable: true }
            archived: { type: boolean }
        variants:
          type: array
          items:
            type: object
            required: [id, name, sku, sellInPos]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              sku: { type: string }
              sellInPos: { type: boolean }
              price: { type: integer, format: int64, nullable: true }
        locations:
          type: array
          items:
            type: object
            required: [id, name, type, status, sold, ownPrice]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              type: { type: string, enum: [event, outlet] }
              status: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
              sold: { type: boolean }
              ownPrice: { type: boolean }
    AddItemsRequest:
      type: object
      required: [productIds]
      properties:
        productIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
    AddItemsResponse:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    UpdateItemRequest:
      type: object
      required: [displayName, status]
      properties:
        displayName: { type: string, maxLength: 40 }
        status: { type: string, enum: [active, archived] }
        basePrice: { type: integer, format: int64, nullable: true }
        variants:
          type: array
          items:
            type: object
            required: [id, sellInPos]
            properties:
              id: { type: string, format: uuid }
              sellInPos: { type: boolean }
              price: { type: integer, format: int64, nullable: true }
        locations:
          type: array
          items:
            type: object
            required: [id, sold]
            properties:
              id: { type: string, format: uuid }
              sold: { type: boolean }
    LocationResponse:
      allOf:
        - { $ref: '#/components/schemas/EventResponse' }
        - type: object
          required: [items]
          properties:
            items: { type: integer }
    CreateLocationRequest:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [event, outlet] }
        name: { type: string }
        address: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
    LocationRow:
      type: object
      required: [itemId, variantId, itemName, variantName, sold]
      properties:
        itemId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        itemName: { type: string }
        variantName: { type: string }
        catalogPrice: { type: integer, format: int64, nullable: true }
        sold: { type: boolean }
        price: { type: integer, format: int64, nullable: true }
    SaveLocationRowsRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [variantId, sold]
            properties:
              variantId: { type: string, format: uuid }
              sold: { type: boolean }
              price: { type: integer, format: int64, nullable: true }
    AddLocationItemsRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
    PairRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 6-digit pairing code }
        model: { type: string }
    DeviceRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        removesAt: { type: string, format: date-time, description: set once the location closed }
    DeviceLocation:
      type: object
      required: [id, name, type, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [event, outlet] }
        status: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    DeviceResponse:
      type: object
      required: [device, location, storeName]
      properties:
        device: { $ref: '#/components/schemas/DeviceRef' }
        location: { $ref: '#/components/schemas/DeviceLocation' }
        storeName: { type: string }
    PairResponse:
      type: object
      required: [token, device, location, storeName]
      properties:
        token: { type: string, description: "send as Authorization: Device <token>; shown only once" }
        device: { $ref: '#/components/schemas/DeviceRef' }
        location: { $ref: '#/components/schemas/DeviceLocation' }
        storeName: { type: string }
    DeviceStaff:
      type: object
      required: [id, name, role, pinHash]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [KASIR, SUPERVISOR] }
        pinHash: { type: string, description: bcrypt }
    StaffRequest:
      type: object
      required: [name, role, locationIds]
      properties:
        name: { type: string, maxLength: 40 }
        role: { type: string, enum: [KASIR, SUPERVISOR] }
        pin: { type: string, pattern: '^[0-9]{4,6}$', description: required on create; resets it on update }
        locationIds: { type: array, items: { type: string, format: uuid } }
        active: { type: boolean }
    StaffResponse:
      type: object
      required: [id, name, role, locationIds, active, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [KASIR, SUPERVISOR] }
        locationIds: { type: array, items: { type: string, format: uuid } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeviceView:
      type: object
      required: [id, name, pairedAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        model: { type: string }
        pairedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        removesAt: { type: string, format: date-time }
    PairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
    RenameDeviceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 40 }
    MemberSync:
      type: object
      required: [enabled, time, lastSyncAt, lastResult, count, source, message]
      properties:
        enabled: { type: boolean }
        time: { type: string, nullable: true, description: "daily run, HH:MM WIB; null when the schedule is not a daily time" }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastResult: { type: string, enum: [SUCCESS, FAILED], nullable: true }
        count: { type: integer }
        source: { type: string, nullable: true }
        message: { type: string, nullable: true }
    MemberScheduleRequest:
      type: object
      required: [enabled, time]
      properties:
        enabled: { type: boolean }
        time: { type: string, description: "HH:MM WIB" }
