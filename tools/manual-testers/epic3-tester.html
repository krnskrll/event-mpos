<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>event-mpos · EPIC-03 tester</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d23; --border:#2a2f37; --text:#e7e9ee; --muted:#9aa3b2; --accent:#e0457b; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); padding:1.2rem; }
  .wrap { max-width:820px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:1.1rem 1.2rem; margin-bottom:1rem; }
  h1 { font-size:1.2rem; margin:0 0 .2rem; } h2 { font-size:1rem; margin:0 0 .6rem; }
  p.sub { color:var(--muted); margin:.1rem 0 .6rem; font-size:.85rem; }
  label { font-size:.75rem; color:var(--muted); }
  input,select { width:100%; padding:.45rem .55rem; margin:.2rem 0 .5rem; background:#0f1115; border:1px solid var(--border); border-radius:8px; color:var(--text); }
  button { cursor:pointer; border:none; border-radius:8px; padding:.45rem .8rem; background:var(--accent); color:#fff; font-weight:600; font-size:.85rem; }
  button.sec { background:transparent; border:1px solid var(--border); color:var(--text); font-weight:500; }
  button.sm { padding:.3rem .55rem; font-size:.78rem; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .chips button { background:transparent; border:1px solid var(--border); color:var(--text); font-weight:500; }
  table { width:100%; border-collapse:collapse; font-size:.83rem; margin-top:.5rem; }
  th,td { text-align:left; padding:.4rem .35rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--muted); }
  .badge { font-size:.7rem; padding:.1rem .45rem; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  pre { background:#0b0d11; border:1px solid var(--border); border-radius:8px; padding:.7rem; overflow:auto; font-size:.78rem; white-space:pre-wrap; word-break:break-all; }
  .ok { color:var(--ok); } .err { color:var(--err); } .who { font-size:.8rem; color:var(--muted); }
  .hidden { display:none; }
  .grid4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>event-mpos — EPIC-03 tester</h1>
    <p class="sub">Product catalogue, ERP sync, per-event availability, and barcode scan (live backend on :8080)</p>
  </div>

  <div class="card" id="loginCard">
    <h2>1. Sign in</h2>
    <div class="row chips" style="margin-bottom:.5rem">
      <button onclick="fill('admin@eventmpos.local','Admin123!')">Admin</button>
      <button onclick="fill('ba@eventmpos.local','Ba123456!')">BA</button>
    </div>
    <div class="row">
      <input id="email" value="admin@eventmpos.local" style="flex:2" />
      <input id="password" value="Admin123!" style="flex:1" />
      <button onclick="login()">Sign in</button>
    </div>
    <div id="loginMsg" class="who"></div>
  </div>

  <!-- ADMIN -->
  <div class="card hidden" id="erpCard">
    <h2>2. Admin · ERP sync</h2>
    <div id="erpStatus" class="who">…</div>
    <button onclick="syncNow()" style="margin-top:.5rem">Sync from ERP now</button>
    <span id="erpMsg" class="ok"></span>
  </div>

  <div class="card hidden" id="prodCard">
    <h2>3. Admin · Products (add &amp; edit)</h2>
    <div class="grid4">
      <input id="pSku" placeholder="SKU" />
      <input id="pName" placeholder="Name" />
      <input id="pBrand" placeholder="Brand" />
      <input id="pPrice" placeholder="Price" type="number" step="0.01" />
    </div>
    <div class="row">
      <input id="pBarcodes" placeholder="barcodes, comma-separated" style="flex:1" />
      <button onclick="addProduct()">Add product</button>
    </div>
    <div id="prodBox">Loading…</div>
  </div>

  <div class="card hidden" id="availCard">
    <h2>4. Admin · Products available per event</h2>
    <select id="availEvent" onchange="loadAvail()"><option value="">Select event…</option></select>
    <div id="availBox"></div>
  </div>

  <!-- BA -->
  <div class="card hidden" id="baCard">
    <h2>2. BA · Snapshot products &amp; barcode scan</h2>
    <button onclick="loadBaProducts()">Load my event snapshot</button>
    <div class="row" style="margin-top:.6rem">
      <input id="scanBox" placeholder="type a barcode e.g. 8990001001" style="flex:1" />
      <button onclick="scan()">Scan</button>
    </div>
    <div id="scanMsg" class="who"></div>
    <div id="baProdBox"></div>
  </div>
</div>

<script>
const API="http://localhost:8080";
let token=null, role=null, baEventId=null;
function fill(e,p){ email.value=e; password.value=p; }
async function req(method,path,body){
  const o={method,headers:{}}; if(token)o.headers.Authorization="Bearer "+token;
  if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  const r=await fetch(API+path,o); let d=null; try{d=await r.json();}catch(_){}
  return {ok:r.ok,status:r.status,data:d};
}
async function login(){
  const r=await req("POST","/api/auth/login",{email:email.value,password:password.value});
  const m=loginMsg;
  if(!r.ok){m.className="err";m.textContent="❌ "+r.status+" "+(r.data?.message||"");return;}
  token=r.data.accessToken; role=r.data.user.role;
  m.className="ok"; m.textContent="✅ "+r.data.user.fullName+" ("+role+")";
  const admin=role==="ADMIN", ba=role==="BA";
  erpCard.classList.toggle("hidden",!admin); prodCard.classList.toggle("hidden",!admin); availCard.classList.toggle("hidden",!admin);
  baCard.classList.toggle("hidden",!ba);
  if(admin){loadErp();loadProducts();loadEvents();}
}
// ---- admin ERP ----
async function loadErp(){
  const r=await req("GET","/api/admin/erp/status");
  erpStatus.textContent = r.data?.lastSyncAt
    ? `Source: ${r.data.source} · last sync ${new Date(r.data.lastSyncAt).toLocaleString()} · ${r.data.lastResult} · ${r.data.productCount} products`
    : "Never synced.";
}
async function syncNow(){
  erpMsg.textContent="…";
  const r=await req("POST","/api/admin/erp/sync");
  if(!r.ok){erpMsg.className="err";erpMsg.textContent="❌ "+r.status;return;}
  erpMsg.className="ok"; erpMsg.textContent=` synced: ${r.data.created} new, ${r.data.updated} updated, ${r.data.total} total`;
  loadErp(); loadProducts();
}
// ---- admin products ----
async function loadProducts(){
  const r=await req("GET","/api/admin/products");
  if(!r.ok){prodBox.innerHTML='<span class="err">'+r.status+'</span>';return;}
  prodBox.innerHTML='<table><thead><tr><th>SKU</th><th>Name</th><th>Brand</th><th>Price</th><th>Source</th><th>Barcodes</th><th></th></tr></thead><tbody>'+
    r.data.map(p=>`<tr><td><span class="badge">${p.sku}</span></td><td>${p.name}</td><td class="who">${p.brand||"—"}</td>
      <td>${p.price.toFixed(2)}</td><td><span class="badge">${p.source}</span></td>
      <td class="who">${p.barcodes.map(b=>b.barcode).join(", ")||"—"}</td>
      <td><button class="sm sec" onclick="editProduct('${p.id}','${p.name.replace(/'/g,"")}',${p.price})">Edit</button></td></tr>`).join("")+
    '</tbody></table>';
}
async function addProduct(){
  const barcodes=pBarcodes.value.split(",").map(s=>s.trim()).filter(Boolean).map(b=>({barcode:b}));
  const r=await req("POST","/api/admin/products",{sku:pSku.value.trim(),name:pName.value.trim(),brand:pBrand.value.trim()||null,price:Number(pPrice.value||0),barcodes});
  if(!r.ok)return alert("❌ "+r.status+" "+(r.data?.message||""));
  pSku.value=pName.value=pBrand.value=pPrice.value=pBarcodes.value=""; loadProducts();
}
async function editProduct(id,name,price){
  const newName=prompt("Name:",name); if(newName===null)return;
  const newPrice=prompt("Price:",price); if(newPrice===null)return;
  const r=await req("PUT","/api/admin/products/"+id,{name:newName,price:Number(newPrice)});
  if(!r.ok)return alert("❌ "+r.status+" "+(r.data?.message||"")); loadProducts();
}
// ---- admin per-event availability ----
async function loadEvents(){
  const r=await req("GET","/api/admin/events");
  if(!r.ok)return;
  availEvent.innerHTML='<option value="">Select event…</option>'+r.data.map(e=>`<option value="${e.id}">${e.code} — ${e.name} (${e.status})</option>`).join("");
}
async function loadAvail(){
  const id=availEvent.value; if(!id){availBox.innerHTML="";return;}
  const r=await req("GET","/api/admin/events/"+id+"/products");
  availBox.innerHTML='<table><thead><tr><th>SKU</th><th>Name</th><th>Price</th><th>Available</th></tr></thead><tbody>'+
    r.data.map(x=>`<tr><td><span class="badge">${x.product.sku}</span></td><td>${x.product.name}</td><td>${x.product.price.toFixed(2)}</td>
      <td><input type="checkbox" style="width:auto;margin:0" ${x.available?"checked":""} onchange="setAvail('${id}','${x.product.id}',this.checked)"></td></tr>`).join("")+
    '</tbody></table>';
}
async function setAvail(eventId,productId,available){
  await req("PUT","/api/admin/events/"+eventId+"/products/"+productId,{available});
}
// ---- BA ----
async function loadBaProducts(){
  const ev=await req("GET","/api/me/event");
  if(!ev.ok){baProdBox.innerHTML='<span class="err">'+ev.status+' '+(ev.data?.message||'')+'</span>';return;}
  baEventId=ev.data.id;
  const r=await req("GET","/api/me/events/"+baEventId+"/snapshot");
  if(!r.ok){baProdBox.innerHTML='<span class="err">'+r.status+' '+(r.data?.message||'')+'</span>';return;}
  baProdBox.innerHTML=`<p class="who">Snapshot version ${r.data.version} · ${r.data.products.length} products</p>`+
    '<table><thead><tr><th>Name</th><th>Price</th><th>Barcodes</th></tr></thead><tbody>'+
    r.data.products.map(p=>`<tr><td>${p.name}</td><td>${p.price.toFixed(2)}</td><td class="who">${p.barcodes.join(", ")}</td></tr>`).join("")+'</tbody></table>';
}
async function scan(){
  if(!baEventId){scanMsg.className="err";scanMsg.textContent="Load the snapshot first.";return;}
  const code=scanBox.value.trim(); if(!code)return;
  const r=await req("GET","/api/me/events/"+baEventId+"/products/by-barcode/"+encodeURIComponent(code));
  if(!r.ok){scanMsg.className="err";scanMsg.textContent="❌ "+(r.data?.message||r.status);return;}
  scanMsg.className="ok"; scanMsg.textContent=`✅ Scanned ${code} → ${r.data.name} (RM ${r.data.price.toFixed(2)})`;
}
</script>
</body>
</html>
