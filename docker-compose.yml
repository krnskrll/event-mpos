# Brings up Postgres + the Go backend API with one command, no local Go toolchain needed:
#   docker compose up --build
# Backend on http://localhost:8080, Postgres on localhost:5432.
# After a schema change, reset old dev databases with: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventmpos
      POSTGRES_USER: eventmpos
      POSTGRES_PASSWORD: eventmpos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventmpos"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend-go
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgres://eventmpos:eventmpos@db:5432/eventmpos?sslmode=disable
      PORT: "8080"
      # Base64, 256-bit. Dev-only value — override JWT_SECRET in any real deployment.
      JWT_SECRET: ZHYtbG9jYWwtZGV2LXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0
      SEED_ENABLED: "true"
      ERP_SOURCE: mock
      MEMBER_SOURCE: mock
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"

volumes:
  pgdata:
